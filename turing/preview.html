<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>turing · preview</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #05060a; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; }
    #stage { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; }
    .vignette {
        position: fixed; inset: 0; pointer-events: none;
        background: radial-gradient(125% 95% at 50% 42%,
            rgba(0,0,0,0) 52%, rgba(0,0,0,0.26) 84%, rgba(0,0,0,0.48) 100%);
    }
</style>
</head>
<body>

<canvas id="stage"></canvas>
<div class="vignette"></div>

<script type="module">
// Same Gray-Scott plate as the post, at card resolution. A random regime and
// glaze per card load, warmed up so the tile is never a blank plate.
import { createRD, PRESETS, PALETTES } from './rd.js';

const rd = createRD(document.getElementById('stage'), {
    res: 150,
    iters: 3,
    warmup: 1100,
});
rd.setPreset(PRESETS[(Math.random() * PRESETS.length) | 0].name);
rd.setPalette(PALETTES[(Math.random() * PALETTES.length) | 0].name);
rd.reseed();
rd.start();
</script>

</body>
</html>
