<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
<title>loops · limbrow.zip</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        background: #05060a;
        color: #e8e8e8;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        font-family: ui-monospace, 'JetBrains Mono', monospace;
        -webkit-user-select: none; user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
    }

    .back {
        position: fixed;
        top: 16px; left: 16px;
        z-index: 100;
        width: 36px; height: 36px;
        display: flex; align-items: center; justify-content: center;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 50%;
        color: rgba(255,255,255,0.65);
        text-decoration: none;
        font-size: 16px;
        line-height: 1;
        padding-bottom: 2px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
    }

    #canvas {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        display: block;
    }

    .vignette {
        position: fixed; inset: 0;
        pointer-events: none;
        z-index: 5;
        background: radial-gradient(130% 100% at 50% 45%,
            rgba(0,0,0,0) 52%, rgba(0,0,0,0.30) 84%, rgba(0,0,0,0.55) 100%);
    }

    /* Mode name — fades in on change, then gets out of the way */
    .label {
        position: fixed;
        top: 20px; right: 16px;
        z-index: 10;
        font-size: 9px;
        letter-spacing: 0.30em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.85);
        mix-blend-mode: difference;
        pointer-events: none;
        opacity: 0;
        transition: opacity 1.1s ease;
        white-space: nowrap;
    }
    .label.on { opacity: 1; transition: opacity 0.12s ease; }

    /* Page indicator (4 dots at bottom) */
    .dots {
        position: fixed;
        bottom: max(22px, env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        display: flex;
        gap: 10px;
        padding: 6px 10px;
        background: rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-radius: 999px;
    }
    .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.28);
        cursor: pointer;
        transition: transform 0.22s cubic-bezier(0.4, 0, 0.2, 1),
                    background 0.22s ease;
    }
    .dot.active {
        background: #fff;
        transform: scale(1.4);
    }
</style>
</head>
<body>

<a class="back" href="/" aria-label="Back to grid">←</a>

<canvas id="canvas"></canvas>
<div class="vignette"></div>

<div class="label" id="label"></div>

<div class="dots" id="dots">
    <div class="dot active" data-idx="0" aria-label="Shapes"></div>
    <div class="dot" data-idx="1" aria-label="Phases"></div>
    <div class="dot" data-idx="2" aria-label="Drift"></div>
    <div class="dot" data-idx="3" aria-label="Wall"></div>
</div>

<script type="module">
// LOOPS — harmonic curves as 3D wire. Engine in curves.js, shared with the
// card preview.
//
//   SHAPES → classical ratios as base, gentle a/b drift, slow δ rotation —
//            contemplative morphing through familiar forms
//   PHASES → every cell at ratio 3:4, almost-static a/b, but a strong δ wave
//            rolls across the grid — a wave of phase travelling
//   DRIFT  → SHAPES base with heavy a/b drift and faster δ — never settles
//   WALL   → denser grid covering 1 ≤ a < b ≤ 9 with full evolution
//
// Swipe horizontally / arrow keys / tap a dot to change mode.
import { createLoops, MODES } from './curves.js';

const loops = createLoops(document.getElementById('canvas'), {
    seed: Math.random() * 20000,
});
loops.start();

const label = document.getElementById('label');
const dotEls = document.querySelectorAll('#dots .dot');
let modeIdx = 0;

function setModeByIdx(idx) {
    modeIdx = (idx + MODES.length) % MODES.length;
    loops.setMode(MODES[modeIdx]);
    dotEls.forEach((d, i) => d.classList.toggle('active', i === modeIdx));
    label.textContent = MODES[modeIdx];
    label.classList.add('on');
    setTimeout(() => label.classList.remove('on'), 900);
}

dotEls.forEach((d, i) => d.addEventListener('click', () => setModeByIdx(i)));

let pStart = null;
window.addEventListener('pointerdown', e => {
    if (e.target.closest('#dots') || e.target.closest('.back')) return;
    pStart = { x: e.clientX, y: e.clientY, t: performance.now() };
}, { passive: true });

window.addEventListener('pointerup', e => {
    if (!pStart) return;
    const dx = e.clientX - pStart.x;
    const dy = e.clientY - pStart.y;
    const dt = performance.now() - pStart.t;
    pStart = null;
    if (dt > 700) return;
    if (Math.abs(dx) < 50) return;
    if (Math.abs(dy) > Math.abs(dx) * 0.7) return;
    setModeByIdx(dx > 0 ? modeIdx - 1 : modeIdx + 1);
}, { passive: true });

window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft')  setModeByIdx(modeIdx - 1);
    if (e.key === 'ArrowRight') setModeByIdx(modeIdx + 1);
});

let _lastTouchEnd = 0;
document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - _lastTouchEnd < 350) e.preventDefault();
    _lastTouchEnd = now;
}, { passive: false });
</script>

</body>
</html>
