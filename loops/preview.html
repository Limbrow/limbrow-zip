<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>loops · preview</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #05060a; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; }
    #canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; }
    .vignette {
        position: fixed; inset: 0; pointer-events: none;
        background: radial-gradient(130% 100% at 50% 45%,
            rgba(0,0,0,0) 54%, rgba(0,0,0,0.26) 86%, rgba(0,0,0,0.48) 100%);
    }
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<div class="vignette"></div>

<script type="module">
// Same wire engine as the post. Auto-cycles the four modes so the card shows
// the whole vocabulary, and starts at a random point in the evolution.
import { createLoops, MODES } from './curves.js';

const loops = createLoops(document.getElementById('canvas'), {
    seed: Math.random() * 40000,
    fps: 20,
});
loops.start();

let i = (Math.random() * MODES.length) | 0;
loops.setMode(MODES[i]);
setInterval(() => {
    i = (i + 1) % MODES.length;
    loops.setMode(MODES[i]);
}, 11000);
</script>

</body>
</html>
