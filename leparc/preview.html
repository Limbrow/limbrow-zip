<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>leparc · preview</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #05060a; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; }
    #stage { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; }
    .vignette {
        position: fixed; inset: 0; pointer-events: none;
        background: radial-gradient(125% 95% at 50% 45%,
            rgba(0,0,0,0) 50%, rgba(0,0,0,0.30) 82%, rgba(0,0,0,0.52) 100%);
    }
</style>
</head>
<body>

<canvas id="stage"></canvas>
<div class="vignette"></div>

<script type="module">
// Same plate engine as the post — chunkier in the card, no pointer, and a
// random seed so each card load catches the field at a different moment.
import { createPlate } from './plate.js';

createPlate(document.getElementById('stage'), {
    density: 13,
    fps: 20,
    seed: Math.random() * 1000,
}).start();
</script>

</body>
</html>
