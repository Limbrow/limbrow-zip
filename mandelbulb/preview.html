<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mandelbulb · preview</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #06060a; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; }
    #stage { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; }
    .vignette {
        position: fixed; inset: 0; pointer-events: none;
        background: radial-gradient(130% 100% at 50% 45%,
            rgba(0,0,0,0) 52%, rgba(0,0,0,0.26) 84%, rgba(0,0,0,0.48) 100%);
    }
</style>
</head>
<body>

<canvas id="stage"></canvas>
<div class="vignette"></div>

<script type="module">
// Same ray marcher at card scale — slower spin, no pointer, random palette per
// load. A card is small, so it renders at a third of its pixels.
import { createBulb } from './bulb.js';

const bulb = createBulb(document.getElementById('stage'), {
    scale: 0.26,
    spin: 0.7,
    fps: 15,      // the priciest per pixel of the lot
    interactive: false,
});
if (bulb) {
    bulb.randomPalette();
    bulb.start();
}
</script>

</body>
</html>
