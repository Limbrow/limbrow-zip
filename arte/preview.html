<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>arte.zip · preview</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #000; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; }
    /* A square stage, centred, as big as the shorter side. In the grid the
       card is square so this is the whole tile. */
    body { display: grid; place-items: center; }
    #cremallera { width: min(100vw, 100vh); width: min(100dvw, 100dvh); aspect-ratio: 1; display: block; }
</style>
<!-- three.js and the engine are the same files as arte-zip/public/branding:
     copied verbatim, so keeping them in sync is a plain `cp`. -->
<script type="importmap">
{"imports":{"three":"./vendor/three/three.module.min.js","three/addons/":"./vendor/three/addons/"}}
</script>
</head>
<body>

<canvas id="cremallera" role="img"
        aria-label="La cremallera de arte.zip: la estructura metálica de una cremallera, sin cinta, que se abre y se cierra."></canvas>

<script type="module">
  // The arte.zip logo in 3D — the zipper from the macOS .zip icon: no cloth
  // tape, only the metal, opening and closing on a 4 s loop. Options as
  // chosen in the lab (/branding/lab-cremallera.html in the arte-zip repo).
  import { montar } from './cremallera.js';
  montar(document.getElementById('cremallera'), {
    tiradorReposo: 'abajo',
    vista: 'frontal',
    angulo: 21,
    sigma: 0.1,
    n: 16,
    orbita: false,
  });
</script>
</body>
</html>
