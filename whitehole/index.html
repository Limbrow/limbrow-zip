<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
<title>whitehole · limbrow.zip</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        background: #000;
        color: #e8e8e8;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        font-family: ui-monospace, 'JetBrains Mono', monospace;
        -webkit-user-select: none; user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
    }

    .back {
        position: fixed;
        top: 16px; left: 16px;
        z-index: 100;
        width: 36px; height: 36px;
        display: flex; align-items: center; justify-content: center;
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 50%;
        color: rgba(255,255,255,0.9);
        text-decoration: none;
        font-size: 16px; line-height: 1; padding-bottom: 2px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
    }

    #gl { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; cursor: grab; }
    #gl:active { cursor: grabbing; }


    .err {
        position: fixed; inset: 0; display: none;
        align-items: center; justify-content: center; padding: 40px;
        text-align: center; line-height: 1.6; font-size: 13px; color: #ccc;
    }
</style>
</head>
<body>

<a class="back" href="/" aria-label="Back to grid">←</a>

<canvas id="gl"></canvas>

<div class="err" id="err">
    WebGL is required to view this artwork.<br>
    On Chrome visit <code>chrome://gpu</code> and enable hardware acceleration.
</div>

<script type="module">
// Chrome only — the physics lives in hole.js, shared with the grid card.
// Same gestures as /singularity next door: drag to orbit, scroll or pinch to
// approach. The one difference is the answer: this horizon only lets things
// OUT, so the closest orbits are on loan and the piece slowly expels you.
import { createHole } from './hole.js';

const isMobile = window.matchMedia('(max-width: 600px)').matches;

let hole = null;
try {
    hole = createHole(document.getElementById('gl'), {
        steps: isMobile ? 210 : 340,
        scale: isMobile ? 0.78 : 0.85,
        focal: isMobile ? 1.12 : 1.5,
        // Mobile pulls back with a wider lens so ring + disk read vertically
        el:    isMobile ? 0.30 : 0.16,
        dist:  isMobile ? 17.0 : 15.0,
    });
} catch (e) {
    console.error(e);
}

if (!hole) document.getElementById('err').style.display = 'flex';
else hole.start();

let _lastTouchEnd = 0;
document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - _lastTouchEnd < 350) e.preventDefault();
    _lastTouchEnd = now;
}, { passive: false });
</script>

</body>
</html>
