<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>whitehole · preview</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #000; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; }
    #gl { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>

<canvas id="gl"></canvas>

<script type="module">
// Same geodesic engine at card budget: fewer steps, smaller backing store,
// 15fps paint (u_time drives everything, so the physics doesn't slow down).
// Near face-on so the blue ring circles the white core, slow azimuth spin
// keeps the Doppler-bright side travelling around it.
import { createHole } from './hole.js';

createHole(document.getElementById('gl'), {
    steps: 160,
    scale: 0.6,
    focal: 1.15,
    az: Math.random() * 6.28,
    el: 1.28,
    dist: 17.0,
    spin: 0.0016,
    fps: 15,
    interactive: false,
})?.start();
</script>

</body>
</html>
