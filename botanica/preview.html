<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>botanica · preview</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #080e14; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; }
    #stage { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; }
    .vignette {
        position: fixed; inset: 0; pointer-events: none;
        background: radial-gradient(130% 105% at 50% 62%,
            rgba(0,0,0,0) 52%, rgba(0,0,0,0.26) 86%, rgba(0,0,0,0.48) 100%);
    }
</style>
</head>
<body>

<canvas id="stage"></canvas>
<div class="vignette"></div>

<script type="module">
// Same garden at card size: fewer plants, faster seasons and a shorter life so
// the tile always has something sprouting and something dropping its blossom.
import { createGarden } from './garden.js';

const garden = createGarden(document.getElementById('stage'), {
    plants: 4,
    seasonMs: 13000,
    growMs: 9000,
});
garden.start();

// an occasional breeze so the card is never quite still
setInterval(() => garden.blow(0.6 + Math.random() * 1.4), 4200);
</script>

</body>
</html>
