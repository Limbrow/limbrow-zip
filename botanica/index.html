<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
<title>botanica · limbrow.zip</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        background: #080e14;
        color: #e8e8e8;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        font-family: ui-monospace, 'JetBrains Mono', monospace;
        -webkit-user-select: none; user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
    }

    .back {
        position: fixed;
        top: 16px; left: 16px;
        z-index: 100;
        width: 36px; height: 36px;
        display: flex; align-items: center; justify-content: center;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255,255,255,0.10);
        border-radius: 50%;
        color: rgba(255,255,255,0.85);
        text-decoration: none;
        font-size: 16px; line-height: 1; padding-bottom: 2px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
    }

    #stage {
        position: fixed; top: 0; left: 0;
        width: 100%; height: 100%;
        display: block;
    }

    .vignette {
        position: fixed; inset: 0;
        pointer-events: none;
        z-index: 5;
        background: radial-gradient(130% 105% at 50% 62%,
            rgba(0,0,0,0) 48%, rgba(0,0,0,0.30) 84%, rgba(0,0,0,0.55) 100%);
    }

    .readout {
        position: fixed;
        bottom: max(12px, env(safe-area-inset-bottom));
        left: 14px;
        z-index: 10;
        font-size: 9px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.85);
        mix-blend-mode: difference;
        pointer-events: none;
        white-space: nowrap;
    }

    .credit {
        position: fixed;
        bottom: max(12px, env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
        color: rgba(255, 255, 255, 0.45);
        mix-blend-mode: difference; pointer-events: none; white-space: nowrap;
    }
</style>
</head>
<body>

<a class="back" href="/" aria-label="Back to grid">←</a>

<canvas id="stage"></canvas>
<div class="vignette"></div>

<div class="readout" id="readout"></div>
<div class="credit">lindenmayer 1968 · tap to sow · drag for wind</div>

<script type="module">
// ════════════════════════════════════════════════════════════════════════════
// BOTANICA — a night garden that grows while you watch.
//
// Each plant is an L-system: one rewriting rule applied to its own output four
// or five times. Lindenmayer wrote these down to describe how algae divide;
// they describe ferns and bushes just as well.
//
// The opcodes are re-interpreted every frame, so the wind is live and nothing
// is baked — the trunk barely moves and the tips whip. Growth reveals segments
// by distance from the root, so plants thicken outward instead of being drawn
// branch by branch. The seasons turn, the blossom opens and drops, and a plant
// that finishes its season is replaced by a seedling.
//
// Engine in garden.js, shared with the card preview.
// ════════════════════════════════════════════════════════════════════════════

import { createGarden } from './garden.js';

const canvas = document.getElementById('stage');
const readout = document.getElementById('readout');
const isMobile = window.matchMedia('(max-width: 600px)').matches;

const garden = createGarden(canvas, {
    plants: isMobile ? 5 : 8,
});
garden.start();

setInterval(() => {
    readout.textContent = garden.season + ' · ' + garden.count + ' plants';
}, 250);

// ─── SOWING AND WEATHER ────────────────────────────────────────────────────
let down = false, moved = false, lastX = 0, sx = 0;

canvas.addEventListener('pointerdown', e => {
    down = true; moved = false;
    sx = lastX = e.clientX;
    canvas.setPointerCapture?.(e.pointerId);
}, { passive: true });

canvas.addEventListener('pointermove', e => {
    if (!down) return;
    const dx = Math.abs(e.clientX - lastX);
    lastX = e.clientX;
    if (Math.abs(e.clientX - sx) > 8) moved = true;
    garden.blow(dx * 0.06);
}, { passive: true });

window.addEventListener('pointerup', e => {
    if (down && !moved) garden.plant(e.clientX / window.innerWidth);
    down = false;
}, { passive: true });

let _lastTouchEnd = 0;
document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - _lastTouchEnd < 350) e.preventDefault();
    _lastTouchEnd = now;
}, { passive: false });
</script>

</body>
</html>
