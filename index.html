<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>limbrow.zip</title>
    <meta name="description" content="Netart archive by limbrow.">
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <meta property="og:title" content="limbrow.zip">
    <meta property="og:description" content="Netart archive by limbrow.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://limbrow.zip">
    <meta property="og:image" content="avatar.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0a0a;
            --card: #0f0f0f;
            --line: #1a1a1a;
            --text: #e8e8e8;
            --muted: #888;
            --dim: #444;
            --accent: #fff;
            --gap: 4px;
        }

        html, body {
            background: var(--bg);
            color: var(--text);
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
        }

        body {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* ── IDENTITY HEADER ── */
        header {
            padding: 28px 16px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .avatar {
            display: block;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            cursor: pointer;
            overflow: hidden;
            background: #000;
            border: 0;
            padding: 0;
            transition: opacity 0.2s ease;
            flex-shrink: 0;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            /* Crop ~7% off the bottom of the source: scale up from the top
               so the bottom overflows and is clipped by the round mask. */
            transform: scale(1.075);
            transform-origin: top center;
        }
        .avatar:hover { opacity: 0.85; }
        .avatar:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 4px;
        }

        .handle {
            font-size: 13px;
            color: var(--text);
            letter-spacing: 0.02em;
            font-weight: 400;
        }
        .handle .slash { color: var(--dim); }
        .handle .ext { color: var(--muted); }

        .tagline {
            font-size: 10px;
            color: var(--muted);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-top: -8px;
        }

        /* ── GRID — IG-style 3 columns, infinite scroll ── */
        main {
            padding: 0 var(--gap) 48px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--gap);
        }

        @media (max-width: 480px) {
            :root { --gap: 2px; }
            main { padding: 0 var(--gap) 24px; }
        }

        /* Desktop: tighter container + smaller avatar so the grid reads
           like an IG profile, not a sprawling wall.                       */
        @media (min-width: 700px) {
            .avatar { width: 48px; height: 48px; }
            main    { max-width: 720px; }
            header  { padding: 22px 16px 16px; gap: 10px; }
        }

        /* ── CARDS ── */
        .card {
            display: block;
            background: var(--card);
            overflow: hidden;
            text-decoration: none;
            position: relative;
            aspect-ratio: 1 / 1;                /* default = perfect square */
            transition: transform 0.2s ease;
        }

        /* Spec for "break the rules" posts. Set in posts.js with width/height in cells. */
        .card.span-2-cols { grid-column: span 2; }
        .card.span-2-rows { grid-row: span 2; }
        .card.span-2x2    { grid-column: span 2; grid-row: span 2; }

        /* Non-square allowed via --aspect when really needed */
        .card[style*="--aspect"] {
            aspect-ratio: 1 / var(--aspect);
        }

        .card .preview {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .card .preview iframe {
            position: absolute;
            top: 0; left: 0;
            border: 0;
            transform-origin: top left;
            pointer-events: none;
            background: #000;
            width: calc(100% / var(--scale, 0.4));
            height: calc(100% / var(--scale, 0.4));
            transform: scale(var(--scale, 0.4));
        }

        /* Hover halo — minimal */
        .card::after {
            content: '';
            position: absolute;
            inset: 0;
            box-shadow: inset 0 0 0 0 rgba(255,255,255,0.15);
            transition: box-shadow 0.2s ease;
            pointer-events: none;
        }
        .card:hover::after { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18); }

        /* ── FOOTER MARK ── */
        footer {
            padding: 48px 16px 32px;
            text-align: center;
            font-size: 9px;
            color: var(--dim);
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        /* Touch devices: iframes always visible (no hover state) */
        @media (hover: none) {
            .card::after { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <a class="avatar" href="/about/" aria-label="References & influences">
            <img src="avatar.jpg" alt="">
        </a>
    </header>

    <main>
        <div class="grid" id="grid"></div>
    </main>

    <script type="module">
        // ── FEED SCHEDULER ────────────────────────────────────────────────
        // Every tile is a live piece running its own animation loop, and there
        // are two dozen of them. Mounting them all and leaving them running is
        // what made the feed stutter: two dozen simulations competing for one
        // main thread, most of them several screens away.
        //
        // So the feed keeps a WINDOW. Only cards near the viewport are mounted,
        // never more than MAX_LIVE at once, and a card that drifts far away has
        // its iframe destroyed outright — which is the only way to be sure its
        // buffers and its animation loop are actually gone.
        //
        // Mounting is also spread out, one iframe every LOAD_GAP. Arriving at
        // the page used to start a dozen engines in the same frame, each
        // allocating buffers and building colour tables; that burst was the
        // stutter you saw on entry.
        import { posts } from './posts.js';

        const grid = document.getElementById('grid');
        const MOBILE = window.matchMedia('(max-width: 600px)').matches;

        const MAX_LIVE = MOBILE ? 6 : 10;   // hard ceiling on running pieces
        const LOAD_GAP = 130;               // ms between one mount and the next
        const NEAR = 0.75;                  // viewports of slack around the screen

        const cards = [];

        function makeCard(post) {
            const el = document.createElement('a');
            el.className = 'card';
            el.href = `/${post.slug}/`;
            el.setAttribute('aria-label', `Open ${post.slug}`);

            // Special span overrides — for hero / breaking-the-grid posts
            if (post.span === '2cols') el.classList.add('span-2-cols');
            else if (post.span === '2rows') el.classList.add('span-2-rows');
            else if (post.span === '2x2') el.classList.add('span-2x2');

            // Aspect override only if absolutely needed
            if (post.aspect) el.style.setProperty('--aspect', post.aspect);
            el.style.setProperty('--scale', post.scale ?? 0.4);

            const holder = document.createElement('div');
            holder.className = 'preview';
            el.appendChild(holder);

            const card = {
                el, holder,
                url: post.preview ? `/${post.slug}/${post.preview}` : `/${post.slug}/`,
                iframe: null, live: false, queued: false,
            };
            cards.push(card);
            return el;
        }

        function mount(card) {
            if (card.live) return;
            const f = document.createElement('iframe');
            f.tabIndex = -1;
            f.setAttribute('aria-hidden', 'true');
            f.setAttribute('scrolling', 'no');
            f.src = card.url;
            card.holder.appendChild(f);
            card.iframe = f;
            card.live = true;
        }

        function unmount(card) {
            card.queued = false;
            if (!card.live) return;
            // Blanking the document first, then dropping the element, is what
            // actually releases the canvas buffers and stops the rAF loop.
            card.iframe.src = 'about:blank';
            card.iframe.remove();
            card.iframe = null;
            card.live = false;
        }

        // ── staggered mounting ──
        const queue = [];
        let draining = false;

        function enqueue(card) {
            if (card.live || card.queued) return;
            card.queued = true;
            queue.push(card);
            if (!draining) {
                draining = true;
                tick();
            }
        }

        function tick() {
            // drop anything that drifted out of the window while it waited
            while (queue.length && !queue[0].queued) queue.shift();
            const card = queue.shift();
            if (!card) { draining = false; return; }
            card.queued = false;
            mount(card);
            setTimeout(tick, LOAD_GAP);
        }

        // ── the window ──
        // Which cards are near is left to IntersectionObserver rather than
        // measured by hand: it is the browser's own answer, and it still works
        // in the cases where window.innerHeight reads 0 (an iframed or
        // not-yet-laid-out page), where rect arithmetic quietly selects nothing.
        function observe(margin, key) {
            const io = new IntersectionObserver(entries => {
                for (const e of entries) e.target.__card[key] = e.isIntersecting;
                onViewportChange();
            }, { rootMargin: margin });
            for (const card of cards) io.observe(card.el);
        }

        function sweep() {
            let cand = cards.filter(c => c.near);
            // Never leave the feed blank: if nothing reports as near — a viewport
            // that measures zero, an observer that hasn't fired yet — fall back
            // to the top of the grid, which is where the reader is anyway.
            if (!cand.length) cand = cards.slice(0, MAX_LIVE);

            cand.sort((a, b) =>
                (Number(b.visible) - Number(a.visible)) || (a.index - b.index));

            const keep = new Set(cand.slice(0, MAX_LIVE));
            for (const card of cards) {
                if (keep.has(card)) enqueue(card);
                else unmount(card);
            }
        }

        let scheduled = false;
        function onViewportChange() {
            if (scheduled) return;
            scheduled = true;
            requestAnimationFrame(() => { scheduled = false; sweep(); });
        }

        // Newest first
        posts
            .slice()
            .sort((a, b) => b.date.localeCompare(a.date))
            .forEach(post => grid.appendChild(makeCard(post)));

        cards.forEach((c, i) => { c.index = i; c.el.__card = c; });
        observe(`${Math.round(NEAR * 100)}% 0px`, 'near');
        observe('0px', 'visible');

        window.addEventListener('resize', onViewportChange);
        sweep();
    </script>
</body>
</html>
