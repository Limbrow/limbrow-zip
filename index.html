<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>limbrow.zip</title>
    <meta name="description" content="Netart archive by limbrow.">
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <meta property="og:title" content="limbrow.zip">
    <meta property="og:description" content="Netart archive by limbrow.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://limbrow.zip">
    <meta property="og:image" content="avatar.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0a0a;
            --card: #0f0f0f;
            --line: #1a1a1a;
            --text: #e8e8e8;
            --muted: #888;
            --dim: #444;
            --accent: #fff;
            --gap: 4px;
        }

        html, body {
            background: var(--bg);
            color: var(--text);
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
        }

        body {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* ── IDENTITY HEADER ── */
        header {
            padding: 28px 16px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .avatar {
            display: block;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            cursor: pointer;
            overflow: hidden;
            background: #000;
            border: 0;
            padding: 0;
            transition: opacity 0.2s ease;
            flex-shrink: 0;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            /* Crop ~7% off the bottom of the source: scale up from the top
               so the bottom overflows and is clipped by the round mask. */
            transform: scale(1.075);
            transform-origin: top center;
        }
        .avatar:hover { opacity: 0.85; }
        .avatar:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 4px;
        }

        .handle {
            font-size: 13px;
            color: var(--text);
            letter-spacing: 0.02em;
            font-weight: 400;
        }
        .handle .slash { color: var(--dim); }
        .handle .ext { color: var(--muted); }

        .tagline {
            font-size: 10px;
            color: var(--muted);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-top: -8px;
        }

        /* ── GRID — IG-style 3 columns, infinite scroll ── */
        main {
            padding: 0 var(--gap) 48px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--gap);
        }

        @media (max-width: 480px) {
            :root { --gap: 2px; }
            main { padding: 0 var(--gap) 24px; }
        }

        /* Desktop: tighter container + smaller avatar so the grid reads
           like an IG profile, not a sprawling wall.                       */
        @media (min-width: 700px) {
            .avatar { width: 48px; height: 48px; }
            main    { max-width: 720px; }
            header  { padding: 22px 16px 16px; gap: 10px; }
        }

        /* ── CARDS ── */
        .card {
            display: block;
            background: var(--card);
            overflow: hidden;
            text-decoration: none;
            position: relative;
            aspect-ratio: 1 / 1;                /* default = perfect square */
            transition: transform 0.2s ease;
        }

        /* Spec for "break the rules" posts. Set in posts.js with width/height in cells. */
        .card.span-2-cols { grid-column: span 2; }
        .card.span-2-rows { grid-row: span 2; }
        .card.span-2x2    { grid-column: span 2; grid-row: span 2; }

        /* Non-square allowed via --aspect when really needed */
        .card[style*="--aspect"] {
            aspect-ratio: 1 / var(--aspect);
        }

        .card .preview {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .card .preview iframe {
            position: absolute;
            top: 0; left: 0;
            border: 0;
            transform-origin: top left;
            pointer-events: none;
            background: #000;
            width: calc(100% / var(--scale, 0.4));
            height: calc(100% / var(--scale, 0.4));
            transform: scale(var(--scale, 0.4));
        }

        /* Hover halo — minimal */
        .card::after {
            content: '';
            position: absolute;
            inset: 0;
            box-shadow: inset 0 0 0 0 rgba(255,255,255,0.15);
            transition: box-shadow 0.2s ease;
            pointer-events: none;
        }
        .card:hover::after { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18); }

        /* ── FOOTER MARK ── */
        footer {
            padding: 48px 16px 32px;
            text-align: center;
            font-size: 9px;
            color: var(--dim);
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        /* Touch devices: iframes always visible (no hover state) */
        @media (hover: none) {
            .card::after { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <a class="avatar" href="/about/" aria-label="References & influences">
            <img src="avatar.jpg" alt="">
        </a>
    </header>

    <main>
        <div class="grid" id="grid"></div>
    </main>

    <script type="module">
        // ── FEED SCHEDULER ────────────────────────────────────────────────
        // Every tile is a live piece running its own animation loop, and there
        // can be dozens of them. Mounting them all and leaving them running is
        // what made the feed stutter: two dozen simulations competing for one
        // main thread, most of them several screens away.
        //
        // So the feed keeps a WINDOW: what is on screen, plus a small halo of
        // cards just outside it, and a card that drifts further away has its
        // iframe destroyed outright — which is the only way to be sure its
        // buffers and its animation loop are actually gone.
        //
        // Mounting is also spread out, one iframe every LOAD_GAP. Arriving at
        // the page used to start a dozen engines in the same frame, each
        // allocating buffers and building colour tables; that burst was the
        // stutter you saw on entry.
        import { posts } from './posts.js';

        const grid = document.getElementById('grid');

        // There is no fixed ceiling on how many pieces run, because a ceiling
        // is exactly what blanked the feed: three columns of square tiles put
        // fifteen or more cards on a phone screen at once, so any number small
        // enough to help performance is smaller than what is actually on
        // screen. What runs is "everything visible, plus a small warm halo".
        const HALO = 3;        // off-screen cards kept mounted, ready to appear
        const FALLBACK = 12;   // when nothing reports as near at all
        const LOAD_GAP = 70;   // ms between one mount and the next
        const NEAR = 0.5;      // viewports of slack that counts as halo

        const cards = [];

        function makeCard(post) {
            const el = document.createElement('a');
            el.className = 'card';
            // A piece that lives on another host (arte.zip) links straight
            // there; its folder here only holds the card preview.
            el.href = post.href || `/${post.slug}/`;
            if (post.href) el.rel = 'noopener';
            el.setAttribute('aria-label',
                `Open ${post.href ? post.href.replace(/^https?:\/\//, '') : post.slug}`);

            // Special span overrides — for hero / breaking-the-grid posts
            if (post.span === '2cols') el.classList.add('span-2-cols');
            else if (post.span === '2rows') el.classList.add('span-2-rows');
            else if (post.span === '2x2') el.classList.add('span-2x2');

            // Aspect override only if absolutely needed
            if (post.aspect) el.style.setProperty('--aspect', post.aspect);
            el.style.setProperty('--scale', post.scale ?? 0.4);

            const holder = document.createElement('div');
            holder.className = 'preview';
            el.appendChild(holder);

            const card = {
                el, holder,
                url: post.preview ? `/${post.slug}/${post.preview}` : `/${post.slug}/`,
                iframe: null, live: false, queued: false,
            };
            cards.push(card);
            return el;
        }

        function mount(card) {
            if (card.live) return;
            const f = document.createElement('iframe');
            f.tabIndex = -1;
            f.setAttribute('aria-hidden', 'true');
            f.setAttribute('scrolling', 'no');
            f.src = card.url;
            card.holder.appendChild(f);
            card.iframe = f;
            card.live = true;
        }

        function unmount(card) {
            card.queued = false;
            if (!card.live) return;
            // Blanking the document first, then dropping the element, is what
            // actually releases the canvas buffers and stops the rAF loop.
            card.iframe.src = 'about:blank';
            card.iframe.remove();
            card.iframe = null;
            card.live = false;
        }

        // ── staggered mounting ──
        const queue = [];
        let draining = false;

        function enqueue(card) {
            if (card.live || card.queued) return;
            card.queued = true;
            queue.push(card);
            if (!draining) {
                draining = true;
                tick();
            }
        }

        function tick() {
            // drop anything that drifted out of the window while it waited
            while (queue.length && !queue[0].queued) queue.shift();
            const card = queue.shift();
            if (!card) { draining = false; return; }
            card.queued = false;
            mount(card);
            setTimeout(tick, LOAD_GAP);
        }

        // ── the window ──
        // The viewport, from whichever source will actually answer.
        function viewportHeight() {
            return window.innerHeight
                || document.documentElement.clientHeight
                || (window.visualViewport && window.visualViewport.height)
                || 0;
        }

        function sweep() {
            const vh = viewportHeight();
            const pad = vh * NEAR;
            const visible = [], halo = [];

            if (vh > 0) {
                for (const card of cards) {
                    const r = card.el.getBoundingClientRect();
                    if (r.height <= 0) continue;              // not laid out yet
                    if (r.bottom > 0 && r.top < vh) visible.push(card);
                    else if (r.bottom > -pad && r.top < vh + pad) halo.push(card);
                }
            }

            let keep;
            if (!visible.length && !halo.length) {
                // The viewport measured zero, or nothing has been laid out yet,
                // so there is no way to know what is on screen. Show the top of
                // the grid — which is where the reader is — rather than nothing.
                keep = new Set(cards.slice(0, FALLBACK));
            } else {
                // Everything on screen runs, always. Only the halo is rationed.
                keep = new Set(visible);
                const mid = visible.length
                    ? (visible[0].index + visible[visible.length - 1].index) / 2
                    : 0;
                halo.sort((a, b) =>
                    Math.abs(a.index - mid) - Math.abs(b.index - mid));
                for (let i = 0; i < halo.length && i < HALO; i++) keep.add(halo[i]);
            }

            for (const card of cards) {
                if (keep.has(card)) enqueue(card);
                else unmount(card);
            }
        }

        // Debounced with a timer, not requestAnimationFrame. rAF is tied to
        // rendering, so anywhere the browser throttles it the sweep would stop
        // running while the page kept scrolling, leaving stale cards mounted
        // and visible ones blank.
        let scheduled = 0;
        function onViewportChange() {
            if (scheduled) return;
            scheduled = setTimeout(() => { scheduled = 0; sweep(); }, 60);
        }

        // Newest first
        posts
            .slice()
            .sort((a, b) => b.date.localeCompare(a.date))
            .forEach(post => grid.appendChild(makeCard(post)));

        cards.forEach((c, i) => { c.index = i; });

        window.addEventListener('scroll', onViewportChange, { passive: true });
        window.addEventListener('resize', onViewportChange);
        window.addEventListener('load', onViewportChange);

        // Safety net. Scroll events are the primary trigger, but they are not
        // guaranteed: they get coalesced during iOS momentum scrolling, they
        // don't fire at all in some embedded viewers, and a page restored from
        // the back/forward cache arrives already scrolled. A few dozen rect
        // reads twice a second cost nothing, and only when something actually
        // moved — without this, a missed event leaves cards blank until the
        // reader happens to scroll again.
        let lastY = -1, lastH = -1;
        setInterval(() => {
            const y = window.scrollY || window.pageYOffset || 0;
            const h = viewportHeight();
            if (y === lastY && h === lastH) return;
            lastY = y; lastH = h;
            sweep();
        }, 500);
        // Layout, fonts and the grid's own sizing all settle after the module
        // runs, so re-check a couple of times early rather than trusting the
        // very first measurement.
        sweep();
        setTimeout(sweep, 120);
        setTimeout(sweep, 600);
    </script>
</body>
</html>
