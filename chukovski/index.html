<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Repin · 1910 · limbrow.zip</title>
<meta name="description" content="Retrato de Kornéi Chukovski, Iliá Repin, 1910. Con luz rasante.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        background: #1a1208;
        color: #f3ead4;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none; user-select: none;
        -webkit-text-size-adjust: 100%;
        touch-action: none;
    }

    /* ─── BLURRED BACKDROP (the painting itself, oversized + blurred) ─── */
    .backdrop {
        position: fixed;
        inset: -60px;
        z-index: 1;
        background-image: url('painting.jpg');
        background-repeat: no-repeat;
        background-position: center;
        background-size: cover;
        filter: blur(48px) saturate(1.15) brightness(0.55);
        transform: scale(1.15);
    }
    .backdrop::after {
        /* Vignette so the edges fade into deep brown, focusing the painting */
        content: '';
        position: absolute;
        inset: 0;
        background:
            radial-gradient(ellipse at 50% 50%, transparent 30%, rgba(8, 5, 2, 0.55) 100%);
    }

    /* ─── BACK ─── */
    .back {
        position: fixed;
        top: 16px; left: 16px;
        z-index: 100;
        width: 36px; height: 36px;
        display: flex; align-items: center; justify-content: center;
        background: rgba(0, 0, 0, 0.25);
        border: 1px solid rgba(255, 255, 255, 0.10);
        border-radius: 50%;
        color: rgba(255, 240, 220, 0.75);
        text-decoration: none;
        font-size: 16px;
        line-height: 1;
        padding-bottom: 2px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        font-family: ui-monospace, monospace;
    }

    /* ─── MODAL (painting + subtle title) ─── */
    .modal {
        position: relative;
        z-index: 10;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(14px, 2.6vh, 24px);
        padding: 56px 24px 32px;
    }

    .painting {
        aspect-ratio: 602 / 717;
        max-width: min(92%, 460px);
        max-height: 70vh;
        display: block;
        touch-action: none;
        cursor: crosshair;
        box-shadow:
            0 40px 70px -10px rgba(0, 0, 0, 0.6),
            0 12px 30px -8px rgba(0, 0, 0, 0.45),
            0 0 0 1px rgba(0, 0, 0, 0.4);
    }

    .title {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-style: italic;
        font-weight: 400;
        font-size: clamp(14px, 3.5vw, 17px);
        line-height: 1.4;
        color: rgba(245, 235, 215, 0.55);
        letter-spacing: 0.03em;
        text-align: center;
        max-width: 28ch;
    }
    .title small {
        display: block;
        font-style: normal;
        font-size: 0.72em;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(245, 235, 215, 0.30);
        margin-top: 0.5em;
    }

    /* ─── FADE-IN ON LOAD ─── */
    .painting, .title {
        opacity: 0;
        transform: translateY(10px);
        animation: rise 1.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    .painting { animation-delay: 0.15s; }
    .title    { animation-delay: 0.95s; }

    @keyframes rise {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-height: 700px) {
        .modal { padding: 48px 20px 22px; gap: 12px; }
        .painting { max-height: 62vh; }
    }
</style>
</head>
<body>

<div class="backdrop"></div>

<a class="back" href="/" aria-label="Volver">←</a>

<main class="modal">
    <canvas class="painting" id="plate"
            aria-label="Retrato de Kornéi Chukovski por Iliá Repin, 1910"></canvas>
    <h1 class="title">
        Retrato de Kornéi Chukovski
        <small>pasa la luz por encima</small>
    </h1>
</main>

<script>
// ════════════════════════════════════════════════════════════════════════════
// CHUKOVSKI — Repin, 1910, under a raking light.
//
// A painting reproduced flat on a screen loses the one thing a painting has
// that an image does not: it is a physical surface. Repin's Chukovski is thick
// — the coat is dragged on, the wall behind is scraped, the hand is a few
// loaded strokes. None of that survives a JPEG viewed head-on.
//
// So this puts the light back. The reproduction's own luminance is read as a
// HEIGHT FIELD: the Sobel gradient at each pixel becomes a surface normal, and
// that normal is lit by a point lamp floating just above the canvas. Ridges
// facing the lamp catch it, the troughs beside them fall into shadow, and the
// brushwork stands up out of the picture — the way it does in a gallery when
// you step to the side of a canvas and look along it instead of at it.
//
// The lamp follows your finger. Left alone it drifts across the surface on its
// own, so the painting keeps turning itself over in the light.
//
// It is an inference, not a measurement — dark PAINT and dark SHADOW are not
// the same thing and this cannot tell them apart. But Repin loaded his light
// passages thickest, so the guess lands more often than it misses.
//
// The lighting is done in linear light and the specular is gated by local
// slope, otherwise the flat varnish glows and the whole plate turns to milk.
// ════════════════════════════════════════════════════════════════════════════

const canvas = document.getElementById('plate');
const gl = canvas.getContext('webgl', { alpha: false, antialias: false });

const VERT = `
attribute vec2 aPos;
varying vec2 vUv;
void main() {
    vUv = vec2(aPos.x * 0.5 + 0.5, 0.5 - aPos.y * 0.5);
    gl_Position = vec4(aPos, 0.0, 1.0);
}`;

const FRAG = `
precision highp float;
uniform sampler2D uTex;
uniform vec2  uTexel;      // one source pixel in uv
uniform vec2  uLamp;       // lamp position in uv
uniform float uAspect;     // width / height
uniform float uRelief;
varying vec2 vUv;

float lum(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }
vec3 toLinear(vec3 c) { return pow(c, vec3(2.2)); }
vec3 toSRGB(vec3 c)   { return pow(max(c, 0.0), vec3(1.0 / 2.2)); }

void main() {
    vec3 base = toLinear(texture2D(uTex, vUv).rgb);

    // Sobel on luminance — the reproduction read as a height field
    float l00 = lum(texture2D(uTex, vUv + vec2(-uTexel.x, -uTexel.y)).rgb);
    float l10 = lum(texture2D(uTex, vUv + vec2( 0.0,      -uTexel.y)).rgb);
    float l20 = lum(texture2D(uTex, vUv + vec2( uTexel.x, -uTexel.y)).rgb);
    float l01 = lum(texture2D(uTex, vUv + vec2(-uTexel.x,  0.0)).rgb);
    float l21 = lum(texture2D(uTex, vUv + vec2( uTexel.x,  0.0)).rgb);
    float l02 = lum(texture2D(uTex, vUv + vec2(-uTexel.x,  uTexel.y)).rgb);
    float l12 = lum(texture2D(uTex, vUv + vec2( 0.0,       uTexel.y)).rgb);
    float l22 = lum(texture2D(uTex, vUv + vec2( uTexel.x,  uTexel.y)).rgb);

    float gx = (l20 + 2.0 * l21 + l22) - (l00 + 2.0 * l01 + l02);
    float gy = (l02 + 2.0 * l12 + l22) - (l00 + 2.0 * l10 + l20);

    // Thin the relief in the dark passages. Repin loaded his lights thickest,
    // and in the shadows the gradient is mostly JPEG noise — left alone it
    // amplifies into crocodile skin across the coat.
    float thick = 0.28 + 0.72 * lum(texture2D(uTex, vUv).rgb);
    gx *= thick; gy *= thick;

    vec3 n = normalize(vec3(-gx * uRelief, -gy * uRelief, 1.0));
    float slope = length(vec2(gx, gy)) * uRelief;

    // A lamp floating just above the surface, not a direction at infinity —
    // that is what gives a pool of light you can move around.
    vec2 d = (uLamp - vUv) * vec2(uAspect, 1.0);
    vec3 L = normalize(vec3(d, 0.34));
    float dist2 = dot(d, d);
    float pool = mix(0.62, 1.0, exp(-dist2 * 3.2));

    float diff = max(dot(n, L), 0.0);
    vec3 H = normalize(L + vec3(0.0, 0.0, 1.0));
    float spec = pow(max(dot(n, H), 0.0), 22.0);
    spec *= clamp(slope * 1.5, 0.0, 1.0);          // only where there is relief

    vec3 col = base * (0.40 + 1.05 * diff) * pool
             + toLinear(vec3(1.0, 0.93, 0.80)) * spec * 0.42 * pool;

    gl_FragColor = vec4(toSRGB(col), 1.0);
}`;

function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        throw new Error(gl.getShaderInfoLog(s));
    }
    return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'aPos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const uTex    = gl.getUniformLocation(prog, 'uTex');
const uTexel  = gl.getUniformLocation(prog, 'uTexel');
const uLamp   = gl.getUniformLocation(prog, 'uLamp');
const uAspect = gl.getUniformLocation(prog, 'uAspect');
const uRelief = gl.getUniformLocation(prog, 'uRelief');

function fit() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(1, Math.round(canvas.clientWidth * dpr));
    const h = Math.max(1, Math.round(canvas.clientHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
    }
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform1f(uAspect, canvas.width / canvas.height);
}
window.addEventListener('resize', fit);

// ─── LAMP ──────────────────────────────────────────────────────────────────
const lamp = { x: 0.5, y: 0.42, tx: 0.5, ty: 0.42, held: false };

function aim(e) {
    const r = canvas.getBoundingClientRect();
    lamp.tx = (e.clientX - r.left) / r.width;
    lamp.ty = (e.clientY - r.top) / r.height;
    lamp.held = true;
}
canvas.addEventListener('pointermove', aim, { passive: true });
canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture?.(e.pointerId);
    aim(e);
}, { passive: true });
canvas.addEventListener('pointerleave', () => { lamp.held = false; });

const img = new Image();
img.src = 'painting.jpg';
img.decode ? img.decode().then(begin).catch(begin) : (img.onload = begin);

function begin() {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);

    gl.uniform1i(uTex, 0);
    // Sample a little wider than one source pixel: at one texel the gradient is
    // mostly JPEG noise rather than brushwork.
    gl.uniform2f(uTexel, 2.0 / img.naturalWidth, 2.0 / img.naturalHeight);
    gl.uniform1f(uRelief, 3.4);
    fit();

    const t0 = performance.now();
    function frame(now) {
        fit();
        const t = (now - t0) * 0.001;
        if (!lamp.held) {
            // Left alone, the lamp wanders across the surface
            lamp.tx = 0.5 + Math.sin(t * 0.19) * 0.36;
            lamp.ty = 0.45 + Math.cos(t * 0.13 + 1.1) * 0.30;
        }
        lamp.x += (lamp.tx - lamp.x) * 0.09;
        lamp.y += (lamp.ty - lamp.y) * 0.09;
        gl.uniform2f(uLamp, lamp.x, lamp.y);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
}

let _lastTouchEnd = 0;
document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - _lastTouchEnd < 350) e.preventDefault();
    _lastTouchEnd = now;
}, { passive: false });
</script>

</body>
</html>
