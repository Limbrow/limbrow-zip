<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ripples · preview</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #04121e; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; }
    #stage { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; }
    .vignette {
        position: fixed; inset: 0; pointer-events: none;
        background: radial-gradient(130% 100% at 50% 45%,
            rgba(0,0,0,0) 54%, rgba(0,0,0,0.24) 86%, rgba(0,0,0,0.46) 100%);
    }
</style>
</head>
<body>

<canvas id="stage"></canvas>
<div class="vignette"></div>

<script type="module">
// Same tank at card size, cycling the barriers and dropping the odd stone so
// the tile is never just a flat standing pattern.
import { createTank, BARRIERS } from './tank.js';

const tank = createTank(document.getElementById('stage'), {
    res: 190,
    steps: 2,
});
tank.randomPalette();

let i = (Math.random() * BARRIERS.length) | 0;
tank.setBarrier(BARRIERS[i]);
tank.start();

setInterval(() => {
    i = (i + 1) % BARRIERS.length;
    tank.setBarrier(BARRIERS[i]);
}, 9000);

setInterval(() => {
    tank.drop(0.45 + Math.random() * 0.5, 0.15 + Math.random() * 0.7, 0.02, 1.2);
}, 2300);
</script>

</body>
</html>
