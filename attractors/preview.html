<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>attractors · preview</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #05060a; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; }
    #stage { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; }
    .vignette {
        position: fixed; inset: 0; pointer-events: none;
        background: radial-gradient(125% 95% at 50% 45%,
            rgba(0,0,0,0) 52%, rgba(0,0,0,0.28) 84%, rgba(0,0,0,0.50) 100%);
    }
</style>
</head>
<body>

<canvas id="stage"></canvas>
<div class="vignette"></div>

<script type="module">
// Same plate engine as the post, at card size. A fresh exposure every 14s so
// the tile keeps turning up new attractors and emulsions.
import { createPlate } from './plate.js';

const plate = createPlate(document.getElementById('stage'), {
    res: 170,
    points: 22000,
    fps: 20,
});
plate.randomPalette();
plate.newPlate();
plate.start();

setInterval(() => {
    plate.randomPalette();
    plate.newPlate();
}, 14000);
</script>

</body>
</html>
