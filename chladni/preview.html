<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chladni · preview</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #04070a; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; }
    #stage { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; }
    .vignette {
        position: fixed; inset: 0; pointer-events: none;
        background: radial-gradient(125% 95% at 50% 45%,
            rgba(0,0,0,0) 52%, rgba(0,0,0,0.28) 84%, rgba(0,0,0,0.50) 100%);
    }
</style>
</head>
<body>

<canvas id="stage"></canvas>
<div class="vignette"></div>

<script type="module">
// Same plate at card size, holding each mode a little shorter so the tile keeps
// rearranging its sand. Random palette and starting mode per load.
import { createSand } from './sand.js';

const sand = createSand(document.getElementById('stage'), {
    res: 170,
    grains: 7000,
    hold: 6000,
    morph: 2600,
    fps: 20,
});
sand.randomPalette();
sand.randomMode();
sand.start();
</script>

</body>
</html>
