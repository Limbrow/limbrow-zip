<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
<title>chladni · limbrow.zip</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        background: #04070a;
        color: #e8e8e8;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        font-family: ui-monospace, 'JetBrains Mono', monospace;
        -webkit-user-select: none; user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
    }

    .back {
        position: fixed;
        top: 16px; left: 16px;
        z-index: 100;
        width: 36px; height: 36px;
        display: flex; align-items: center; justify-content: center;
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 50%;
        color: rgba(255,255,255,0.9);
        text-decoration: none;
        font-size: 16px; line-height: 1; padding-bottom: 2px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
    }

    #stage {
        position: fixed; top: 0; left: 0;
        width: 100%; height: 100%;
        display: block;
    }

    .vignette {
        position: fixed; inset: 0;
        pointer-events: none;
        z-index: 5;
        background: radial-gradient(125% 95% at 50% 45%,
            rgba(0,0,0,0) 46%, rgba(0,0,0,0.34) 82%, rgba(0,0,0,0.60) 100%);
    }

    .readout {
        position: fixed;
        bottom: max(12px, env(safe-area-inset-bottom));
        left: 14px;
        z-index: 10;
        font-size: 9px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.9);
        mix-blend-mode: difference;
        pointer-events: none;
        white-space: nowrap;
    }

    .credit {
        position: fixed;
        bottom: max(12px, env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        font-size: 9px; letter-spacing: 0.24em; text-transform: uppercase;
        color: rgba(255, 255, 255, 0.5);
        mix-blend-mode: difference; pointer-events: none; white-space: nowrap;
    }
</style>
</head>
<body>

<a class="back" href="/" aria-label="Back to grid">←</a>

<canvas id="stage"></canvas>
<div class="vignette"></div>

<div class="readout" id="readout"></div>
<div class="credit">chladni 1787 · tap to ring · drag to sprinkle</div>

<script type="module">
// ════════════════════════════════════════════════════════════════════════════
// CHLADNI — sand on a vibrating plate.
//
// The nodal lines of a standing wave are the only part of a ringing plate that
// stays still. Sand thrown around by everything else piles up on them, so the
// invisible shape of the note draws itself. Nothing here solves for those
// curves — 25,000 grains just read how hard the plate is shaking underneath
// them and hop accordingly, and the figure is wherever they stop.
//
// Engine in sand.js, shared with the card preview.
// ════════════════════════════════════════════════════════════════════════════

import { createSand } from './sand.js';

const canvas = document.getElementById('stage');
const readout = document.getElementById('readout');
const isMobile = window.matchMedia('(max-width: 600px)').matches;

const sand = createSand(canvas, {
    res: isMobile ? 300 : 460,
    grains: isMobile ? 14000 : 26000,
});
sand.start();

setInterval(() => {
    readout.textContent = 'mode ' + sand.mode + ' · ' + sand.palette;
}, 140);

// ─── GESTURES ──────────────────────────────────────────────────────────────
let down = false, moved = false, sx = 0, sy = 0;

canvas.addEventListener('pointerdown', e => {
    down = true; moved = false;
    sx = e.clientX; sy = e.clientY;
    canvas.setPointerCapture?.(e.pointerId);
}, { passive: true });

canvas.addEventListener('pointermove', e => {
    if (!down) return;
    if (Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy) > 6) moved = true;
    if (!moved) return;
    sand.sprinkle(e.clientX / window.innerWidth, e.clientY / window.innerHeight, 0.045);
}, { passive: true });

window.addEventListener('pointerup', () => {
    if (down && !moved) sand.randomMode();
    down = false;
}, { passive: true });

window.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); sand.nextMode(); }
    if (e.key.toLowerCase() === 'p') sand.randomPalette();
});

let _lastTouchEnd = 0;
document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - _lastTouchEnd < 350) e.preventDefault();
    _lastTouchEnd = now;
}, { passive: false });
</script>

</body>
</html>
