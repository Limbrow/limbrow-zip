<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>opus.zip · preview</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #000; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; }
    #gl { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>

<canvas id="gl" role="img"
        aria-label="Dos cuerpos que bailan en órbita al compás del Preludio en do mayor de Bach; las ondas que suelta cada nota se cruzan entre ellos."></canvas>

<script type="module">
// opus.zip, the card. Two bodies in deep space, bound by gravity, dancing to
// Bach's Prelude in C (BWV 846). The score drives the orbit: one turn per
// bar with the closest approach on the downbeat, the bass line turns the
// whole floor (15° per semitone, so the piece comes home after one full
// turn), and the dissonance of each chord sets how eccentric the bar is.
//
// Every note sends out a wave train from the body that plays it — left hand
// from the heavy one, right hand from the light one — with a wavelength set
// by its pitch. The trains are summed as real waves, so where two crests meet
// they brighten and where a crest meets a trough they cancel: the chord shows
// up as interference between the two. The waves also ripple the starlight,
// and each body bends the stars behind it.
//
// Silent on purpose: the card links out to opus.zip, where the music is.

const cv = document.getElementById('gl');
const gl = cv.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'low-power' });
const FPS = 20;   // card budget; the score runs on the clock, not on frames
const MAXW = 24;  // wave trains alive at once

const wrapPi = x => x - 2 * Math.PI * Math.round(x / (2 * Math.PI));

// ── The score ───────────────────────────────────────────────────────────
// Bars 1–32 are one figure over a new chord each bar: the chord's five
// notes played 0 1 2 3 4 2 3 4, twice. The first two are the left hand
// (body A, the heavy one), the other three the right hand (body B).
const CHORDS = [
    [60, 64, 67, 72, 76], [60, 62, 69, 74, 77], [59, 62, 67, 74, 77], [60, 64, 67, 72, 76],
    [60, 64, 69, 76, 81], [60, 62, 66, 69, 74], [59, 62, 67, 74, 79], [59, 60, 64, 67, 72],
    [57, 60, 64, 67, 72], [50, 57, 62, 66, 72], [55, 59, 62, 67, 71], [55, 58, 64, 67, 73],
    [53, 57, 62, 69, 74], [53, 56, 62, 65, 71], [52, 55, 60, 67, 72], [52, 53, 57, 60, 65],
    [50, 53, 57, 60, 65], [43, 50, 55, 59, 65], [48, 52, 55, 60, 64], [48, 55, 58, 60, 64],
    [41, 53, 57, 60, 64], [42, 48, 57, 60, 63], [44, 53, 59, 60, 62], [43, 53, 55, 59, 62],
    [43, 52, 55, 60, 64], [43, 50, 55, 60, 65], [43, 50, 55, 59, 65], [43, 51, 57, 60, 66],
    [43, 52, 55, 60, 67], [43, 50, 55, 60, 65], [43, 50, 55, 59, 65], [36, 48, 55, 58, 64],
];
const FIGURE = [0, 1, 2, 3, 4, 2, 3, 4, 0, 1, 2, 3, 4, 2, 3, 4];
const hand = i => i < 2 ? 0 : 1;
const BARS = CHORDS.map(c => FIGURE.map(i => [[c[i], hand(i)]]));
// Bars 33–34 leave the figure; 35 is the closing chord, then a bar of rest
// in which nothing sounds and the dance settles into a circle.
const free = ns => ns.map((m, i) => [[m, hand(i)]]);
BARS.push(free([36, 48, 53, 57, 60, 65, 60, 57, 60, 57, 53, 57, 53, 50, 53, 50]));
BARS.push(free([36, 47, 67, 71, 74, 77, 74, 71, 74, 71, 67, 71, 62, 65, 64, 62]));
BARS.push([[[36, 0], [48, 0], [64, 1], [67, 1], [72, 1]], ...Array.from({ length: 15 }, () => [])]);
BARS.push(Array.from({ length: 16 }, () => []));

const BAR = 3.5;           // seconds per bar, ♩ ≈ 69
const STEP = BAR / 16;

// How much a chord grinds: semitones, tritones, whole tones between its
// pitch classes. A plain triad gives 0 and a near-circular bar.
function tension(ms) {
    const pcs = [...new Set(ms.map(m => m % 12))];
    let t = 0;
    for (let i = 0; i < pcs.length; i++) for (let j = i + 1; j < pcs.length; j++) {
        const d = (pcs[j] - pcs[i] + 12) % 12, ic = Math.min(d, 12 - d);
        t += ic === 1 ? 3 : ic === 6 ? 2.5 : ic === 2 ? 1.2 : 0;
    }
    return t;
}
let lastBass = 60;
const PARAMS = BARS.map(steps => {
    const ms = steps.flat().map(n => n[0]);
    if (!ms.length) return { e: 0.03, w: (60 - lastBass) * Math.PI / 12 };
    lastBass = Math.min(...ms);
    return { e: 0.06 + 0.36 * Math.min(1, tension(ms) / 7), w: (60 - lastBass) * Math.PI / 12 };
});

// Wavelength from pitch, in card sides: an octave up shortens it by √2, so
// the bass rolls out in long swells and the treble in fine ripples.
const wavelength = m => 0.038 * 2 ** ((60 - m) / 24);

// ── The two bodies ──────────────────────────────────────────────────────
// Lengths are in units of the card's short side, origin at the centre of
// mass, y up. A is the heavy partner, B the light one.
const M1 = 1, M2 = 0.6, MT = M1 + M2;
const A_AXIS = 0.43;
const BODY = [
    { R: 0.066, lever: -M2 / MT, x: 0, y: 0 },
    { R: 0.05, lever: M1 / MT, x: 0, y: 0 },
];

// Kepler's equation, M = E − e sin E, by Newton.
function eccentric(M, e) {
    let E = M + e * Math.sin(M);
    for (let i = 0; i < 6; i++) E -= (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
    return E;
}

// ── The shader ──────────────────────────────────────────────────────────
// Everything is lit and summed in linear light, tone-mapped, then encoded
// to sRGB with a dither so the dark sky doesn't band.
const FRAG = `
precision highp float;
uniform vec2 u_res;
uniform float u_S, u_px, u_time;
uniform vec4 u_body[2];        // x, y, radius, Einstein radius (px)
uniform vec4 u_wave[${MAXW}];  // x, y, front radius (px), amplitude
uniform vec4 u_wk[${MAXW}];    // wavenumber, envelope width, wavelength (px)
uniform int u_n;

float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vnoise(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
}
float fbm(vec2 p) {
    float s = 0.0, a = 0.5;
    for (int i = 0; i < 4; i++) { s += a * vnoise(p); p = p * 2.03 + 11.7; a *= 0.5; }
    return s;
}

// One star per cell at most, kept off the cell edges so none is cut.
vec3 stars(vec2 p, float cell, float density, float seed) {
    vec2 c = floor(p / cell);
    float h = hash(c + seed);
    if (h > density) return vec3(0.0);
    vec2 o = 0.2 + 0.6 * vec2(hash(c + seed + 1.3), hash(c + seed + 2.7));
    float d = length(p - (c + o) * cell);
    float b = pow(hash(c + seed + 3.1), 6.0);
    float r = (0.5 + 0.9 * b) * u_px;
    float tw = 0.8 + 0.2 * sin(u_time * (0.7 + 2.5 * hash(c + seed + 9.0)) + 6.28 * h);
    vec3 tint = mix(vec3(0.70, 0.80, 1.0), vec3(1.0, 0.82, 0.62), hash(c + seed + 5.3));
    return tint * (0.04 + 1.8 * b) * tw * exp(-d * d / (r * r));
}

vec3 toSrgb(vec3 c) {
    c = clamp(c, 0.0, 1.0);
    return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c));
}

void main() {
    vec2 p = gl_FragCoord.xy;

    // the wave field: every train summed with its sign
    float h = 0.0;
    vec2 disp = vec2(0.0);
    for (int i = 0; i < ${MAXW}; i++) {
        if (i >= u_n) break;
        vec4 w = u_wave[i];
        vec4 k = u_wk[i];
        vec2 dv = p - w.xy;
        float d = length(dv) + 1e-3;
        float u = d - w.z;
        float g = exp(-(u * u) / (k.y * k.y));
        if (g < 0.002) continue;
        h += w.w * g * cos(k.x * u);
        disp += (dv / d) * (w.w * g * sin(k.x * u) * k.z * 0.12);
    }

    // where the starlight comes from: rippled by the waves, bent by the masses
    vec2 q = p + disp;
    for (int j = 0; j < 2; j++) {
        vec2 dv = p - u_body[j].xy;
        float te = u_body[j].w, R = u_body[j].z;
        q -= te * te * dv / (dot(dv, dv) + 0.09 * R * R);
    }

    vec3 col = vec3(0.0010, 0.0012, 0.0024);
    float n = fbm(q / (u_S * 0.5) + vec2(3.1, 7.7));
    float m = fbm(q / (u_S * 0.21) + vec2(-5.2, 1.4));
    col += vec3(0.006, 0.007, 0.018) * pow(n, 4.0) * 2.4 + vec3(0.010, 0.004, 0.008) * pow(n * m, 3.0) * 2.0;
    col += stars(q, 9.0 * u_px, 0.30, 1.0);
    col += stars(q, 17.0 * u_px, 0.45, 7.0);
    col += stars(q, 33.0 * u_px, 0.55, 13.0);

    // the waves, in the rubric: thin crests, troughs only a breath. The sum
    // is signed, so crossing crests stack (and the power makes them flare)
    // while a crest over a trough goes dark.
    vec3 rub = vec3(0.658, 0.162, 0.111);
    col += rub * (pow(max(h, 0.0), 2.2) * 1.0 + max(-h, 0.0) * 0.05);

    col = 1.0 - exp(-col * 1.15);

    // the two bodies, lit from the upper left, never lit by the music
    vec3 L = normalize(vec3(-0.45, 0.5, 0.74));
    vec3 alb = vec3(0.80, 0.76, 0.65);
    for (int j = 0; j < 2; j++) {
        vec2 dv = p - u_body[j].xy;
        float R = u_body[j].z;
        float a = clamp((R - length(dv)) / u_px + 0.5, 0.0, 1.0);
        if (a <= 0.0) continue;
        vec2 s = dv / R;
        vec3 nrm = vec3(s, sqrt(max(0.0, 1.0 - dot(s, s))));
        float dif = max(dot(nrm, L), 0.0);
        float spec = pow(max(dot(reflect(-L, nrm), vec3(0.0, 0.0, 1.0)), 0.0), 24.0);
        vec3 bc = alb * (0.07 + 0.93 * pow(dif, 0.85)) + vec3(0.05) * spec;
        col = mix(col, 1.0 - exp(-bc * 1.15), a);
    }

    gl_FragColor = vec4(toSrgb(col) + (hash(p + fract(u_time * 7.0)) - 0.5) / 255.0, 1.0);
}`;

const VERT = 'attribute vec2 a; void main() { gl_Position = vec4(a, 0.0, 1.0); }';

function program() {
    const sh = (type, src) => {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
        return s;
    };
    const pr = gl.createProgram();
    gl.attachShader(pr, sh(gl.VERTEX_SHADER, VERT));
    gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FRAG));
    gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
    return pr;
}

if (gl) {
    const pr = program();
    gl.useProgram(pr);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(pr, 'a');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const U = {};
    for (const n of ['u_res', 'u_S', 'u_px', 'u_time', 'u_body', 'u_wave', 'u_wk', 'u_n']) U[n] = gl.getUniformLocation(pr, n);

    const bodyBuf = new Float32Array(8), waveBuf = new Float32Array(4 * MAXW), wkBuf = new Float32Array(4 * MAXW);
    const st = { e: PARAMS[0].e, w: PARAMS[0].w, step: -1 };
    const waves = [];
    const SPEED = 0.3;        // card sides per second

    let t0 = null, last = 0;

    const frame = now => {
        requestAnimationFrame(frame);
        if (t0 === null) t0 = now;
        if (now - last < 1000 / FPS - 2) return;
        const dt = Math.min(0.1, (now - last) / 1000);
        last = now;
        const T = (now - t0) / 1000;

        // ── the clock ──
        const stepNow = Math.floor(T / STEP);
        const P = PARAMS[Math.floor(stepNow / 16) % BARS.length];
        const ease = 1 - Math.exp(-dt / 0.55);
        st.e += (P.e - st.e) * ease;
        st.w += wrapPi(P.w - st.w) * ease;

        // ── the orbit: one turn per bar, periastron on the downbeat ──
        const e = st.e, E = eccentric(2 * Math.PI * ((T / BAR) % 1), e);
        const px = A_AXIS * (Math.cos(E) - e), py = A_AXIS * Math.sqrt(1 - e * e) * Math.sin(E);
        const c = Math.cos(st.w), s = Math.sin(st.w);
        const rx = px * c - py * s, ry = px * s + py * c;
        for (const b of BODY) { b.x = rx * b.lever; b.y = ry * b.lever; }

        // ── what sounds: every step since the last frame ──
        if (stepNow - st.step > 6) st.step = stepNow - 1;    // back from a hidden tab: don't burst
        for (let k = st.step + 1; k <= stepNow; k++) {
            for (const [m, h] of BARS[Math.floor(k / 16) % BARS.length][k % 16]) {
                const b = BODY[h];
                waves.push({ x: b.x, y: b.y, R0: b.R, t: T, lam: wavelength(m), life: h ? 1.6 : 2.4, amp: h ? 0.7 : 1 });
            }
        }
        st.step = stepNow;
        for (let i = waves.length - 1; i >= 0; i--) if (T - waves[i].t > waves[i].life) waves.splice(i, 1);
        if (waves.length > MAXW) waves.splice(0, waves.length - MAXW);

        // ── canvas size, measured every paint (an iframe can report 0 at parse) ──
        const cw = cv.clientWidth || innerWidth || 300;
        const ch = cv.clientHeight || innerHeight || cw;
        const dpr = Math.min(devicePixelRatio || 1, 1.5);
        const bw = Math.max(1, Math.round(cw * dpr)), bh = Math.max(1, Math.round(ch * dpr));
        if (cv.width !== bw || cv.height !== bh) { cv.width = bw; cv.height = bh; }
        gl.viewport(0, 0, bw, bh);
        const S = Math.min(bw, bh), cx = bw / 2, cy = bh / 2;

        BODY.forEach((b, i) => {
            bodyBuf.set([cx + b.x * S, cy + b.y * S, b.R * S, 1.25 * b.R * S], i * 4);
        });
        waves.forEach((w, i) => {
            const age = T - w.t;
            const lam = Math.max(w.lam * S, 4.5 * dpr);     // never finer than the pixels can carry
            // Born faint and only grown once clear of the body: a crest
            // hugging the rim would read as the ball lighting up.
            const rise = Math.min(1, age / 0.3), amp = w.amp * rise * rise * (3 - 2 * rise) * (1 - age / w.life) ** 2;
            waveBuf.set([cx + w.x * S, cy + w.y * S, (w.R0 + SPEED * age) * S, amp], i * 4);
            wkBuf.set([2 * Math.PI / lam, lam, lam, 0], i * 4);
        });

        gl.uniform2f(U.u_res, bw, bh);
        gl.uniform1f(U.u_S, S);
        gl.uniform1f(U.u_px, dpr);
        gl.uniform1f(U.u_time, T);
        gl.uniform4fv(U.u_body, bodyBuf);
        gl.uniform4fv(U.u_wave, waveBuf);
        gl.uniform4fv(U.u_wk, wkBuf);
        gl.uniform1i(U.u_n, waves.length);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
    };

    requestAnimationFrame(frame);
}
</script>
