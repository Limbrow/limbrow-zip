<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
<title>voronoi · limbrow.zip</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        background: #05060a;
        color: #e8e8e8;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        font-family: ui-monospace, 'JetBrains Mono', monospace;
        -webkit-user-select: none; user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
    }

    .back {
        position: fixed;
        top: 16px; left: 16px;
        z-index: 100;
        width: 36px; height: 36px;
        display: flex; align-items: center; justify-content: center;
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 50%;
        color: rgba(255,255,255,0.9);
        text-decoration: none;
        font-size: 16px; line-height: 1; padding-bottom: 2px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
    }

    #stage {
        position: fixed; top: 0; left: 0;
        width: 100%; height: 100%;
        display: block;
    }

    .vignette {
        position: fixed; inset: 0;
        pointer-events: none;
        z-index: 4;
        background: radial-gradient(130% 100% at 50% 45%,
            rgba(0,0,0,0) 50%, rgba(0,0,0,0.30) 84%, rgba(0,0,0,0.55) 100%);
    }

    .readout {
        position: fixed;
        bottom: max(12px, env(safe-area-inset-bottom));
        left: 14px;
        z-index: 10;
        font-size: 9px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.92);
        mix-blend-mode: difference;
        pointer-events: none;
        white-space: nowrap;
    }

    /* ── FLOATING GLASS PANEL ── */
    .panel {
        position: fixed;
        bottom: max(16px, env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;
        width: min(420px, calc(100vw - 28px));
        background: rgba(8, 10, 22, 0.65);
        backdrop-filter: blur(20px) saturate(140%);
        -webkit-backdrop-filter: blur(20px) saturate(140%);
        border: 1px solid rgba(255,255,255,0.10);
        border-radius: 16px;
        padding: 10px 14px 13px;
        box-shadow: 0 18px 50px rgba(0,0,0,0.5);
    }

    .head {
        display: flex; align-items: center; gap: 8px;
        cursor: pointer;
        font-size: 10px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.92);
    }
    .head .dot {
        width: 6px; height: 6px; border-radius: 50%;
        background: #c8a4ff;
        box-shadow: 0 0 8px rgba(200,164,255,0.9);
        flex-shrink: 0;
    }
    .head .caret { margin-left: auto; opacity: 0.55; font-size: 9px; transition: transform 0.2s ease; }
    .panel.minimized .caret { transform: rotate(-90deg); }
    .panel.minimized .body { display: none; }

    .body { margin-top: 11px; display: flex; flex-direction: column; gap: 10px; }

    .row { display: flex; flex-direction: column; gap: 5px; }
    .row > .lbl {
        font-size: 8px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.40);
    }

    .seg {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 2px;
        padding: 2px;
        background: rgba(255,255,255,0.05);
        border-radius: 9px;
    }
    .seg button {
        appearance: none; border: 0; cursor: pointer;
        background: transparent;
        color: rgba(255,255,255,0.52);
        font: inherit;
        font-size: 8px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 6px 1px;
        border-radius: 7px;
        transition: background 0.16s ease, color 0.16s ease;
    }
    .seg button.on { background: rgba(255,255,255,0.14); color: #fff; }

    .chips { display: flex; gap: 7px; }
    .chip {
        width: 24px; height: 24px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.16);
        cursor: pointer;
        padding: 0;
        appearance: none;
        transition: transform 0.16s ease, box-shadow 0.16s ease;
    }
    .chip.on {
        transform: scale(1.16);
        box-shadow: 0 0 0 1.5px rgba(255,255,255,0.85);
    }

    .acts { display: flex; gap: 7px; }
    .acts button {
        appearance: none; cursor: pointer;
        flex: 1;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.10);
        border-radius: 9px;
        color: rgba(255,255,255,0.80);
        font: inherit;
        font-size: 8.5px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        padding: 7px 4px;
    }
    .acts button:active { background: rgba(255,255,255,0.16); }

    .hint {
        font-size: 8px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.28);
        text-align: center;
    }
</style>
</head>
<body>

<a class="back" href="/" aria-label="Back to grid">←</a>

<canvas id="stage"></canvas>
<div class="vignette"></div>

<div class="readout" id="readout"></div>

<div class="panel" id="panel">
    <div class="head" id="head">
        <span class="dot"></span>
        <span>voronoi</span>
        <span class="caret">▾</span>
    </div>
    <div class="body">
        <div class="row">
            <span class="lbl">metric</span>
            <div class="seg" id="seg"></div>
        </div>
        <div class="row">
            <span class="lbl">glass</span>
            <div class="chips" id="chips"></div>
        </div>
        <div class="acts">
            <button id="reseed">rescatter</button>
        </div>
        <div class="hint">drag to shove the seeds</div>
    </div>
</div>

<script type="module">
// ════════════════════════════════════════════════════════════════════════════
// VORONOI — stained glass that can't stop moving.
//
// Every point belongs to its nearest seed. Change what "nearest" MEANS and the
// same seeds tile the plane completely differently: circles become diamonds,
// diamonds become squares. The edges are never drawn — they are simply where
// the two nearest seeds are nearly tied, which is why they stay crisp.
//
// Engine in cells.js, shared with the card preview.
// ════════════════════════════════════════════════════════════════════════════

import { createCells, METRICS, PALETTES } from './cells.js';

const canvas = document.getElementById('stage');
const isMobile = window.matchMedia('(max-width: 600px)').matches;

const cells = createCells(canvas, {
    res: isMobile ? 210 : 320,
    seeds: isMobile ? 26 : 36,
});
cells.start();

// ─── PANEL ─────────────────────────────────────────────────────────────────
const panel = document.getElementById('panel');
document.getElementById('head').addEventListener('click', () => {
    panel.classList.toggle('minimized');
});

const seg = document.getElementById('seg');
function markMetric() {
    seg.querySelectorAll('button').forEach(b =>
        b.classList.toggle('on', b.dataset.name === cells.metric));
}
METRICS.forEach(m => {
    const b = document.createElement('button');
    b.textContent = m;
    b.dataset.name = m;
    b.addEventListener('click', () => { cells.setMetric(m); markMetric(); });
    seg.appendChild(b);
});
markMetric();

const chips = document.getElementById('chips');
PALETTES.forEach((p, i) => {
    const b = document.createElement('button');
    b.className = 'chip' + (i === 0 ? ' on' : '');
    const a = p.anchors;
    b.style.background = `conic-gradient(rgb(${a[0]}), rgb(${a[2]}), rgb(${a[4]}), rgb(${a[0]}))`;
    b.setAttribute('aria-label', p.name);
    b.addEventListener('click', () => {
        cells.setPalette(p.name);
        chips.querySelectorAll('.chip').forEach(o => o.classList.toggle('on', o === b));
    });
    chips.appendChild(b);
});

document.getElementById('reseed').addEventListener('click', () => cells.reseed());

const readout = document.getElementById('readout');
setInterval(() => {
    readout.textContent = cells.metric + ' · ' + cells.seeds + ' seeds · ' + cells.palette;
}, 200);

// ─── SHOVING ───────────────────────────────────────────────────────────────
let down = false, moved = false, sx = 0, sy = 0;

canvas.addEventListener('pointerdown', e => {
    down = true; moved = false;
    sx = e.clientX; sy = e.clientY;
    canvas.setPointerCapture?.(e.pointerId);
    cells.shove(e.clientX / window.innerWidth, e.clientY / window.innerHeight);
}, { passive: true });

canvas.addEventListener('pointermove', e => {
    if (!down) return;
    if (Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy) > 6) moved = true;
    cells.shove(e.clientX / window.innerWidth, e.clientY / window.innerHeight);
}, { passive: true });

window.addEventListener('pointerup', () => {
    if (down) {
        cells.release();
        if (!moved) markMetric(cells.nextMetric()), markMetric();
    }
    down = false;
}, { passive: true });

window.addEventListener('keydown', e => {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); cells.nextMetric(); markMetric(); }
    if (e.key.toLowerCase() === 'p') cells.randomPalette();
});

let _lastTouchEnd = 0;
document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - _lastTouchEnd < 350) e.preventDefault();
    _lastTouchEnd = now;
}, { passive: false });
</script>

</body>
</html>
