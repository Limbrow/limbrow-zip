<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>voronoi · preview</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #05060a; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; }
    #stage { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; }
    .vignette {
        position: fixed; inset: 0; pointer-events: none;
        background: radial-gradient(130% 100% at 50% 45%,
            rgba(0,0,0,0) 54%, rgba(0,0,0,0.26) 86%, rgba(0,0,0,0.48) 100%);
    }
</style>
</head>
<body>

<canvas id="stage"></canvas>
<div class="vignette"></div>

<script type="module">
// Same tiling engine at card size. Cycles the four metrics so the tile shows
// the whole point of the piece — same seeds, different idea of "nearest".
import { createCells, METRICS } from './cells.js';

const cells = createCells(document.getElementById('stage'), {
    res: 170,
    seeds: 22,
});
cells.randomPalette();
cells.start();

let i = (Math.random() * METRICS.length) | 0;
cells.setMetric(METRICS[i]);
setInterval(() => {
    i = (i + 1) % METRICS.length;
    cells.setMetric(METRICS[i]);
}, 7000);
</script>

</body>
</html>
